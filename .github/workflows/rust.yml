name: Rust (native)

on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # ROM-derived assets are not in git (history purged 2026-11-08), so CI cannot run the app tests that load
      # courses/models. It checks that everything compiles and runs the engine-free sim unit tests; the full suite
      # (`cargo test --release --workspace`) runs locally against extracted assets (native/BYOR.md).
      - name: Build everything (incl. tests)
        run: cargo check --workspace --all-targets --locked
      - name: Engine-free sim unit tests
        run: cargo test -p jumpman-sim --lib --locked
      - name: Clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked
