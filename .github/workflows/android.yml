name: Android APK (BYOR)

# Builds the sideloadable Android app (no Nintendo data inside; see native/ANDROID.md), uploads it as a workflow artifact
# and, on main, publishes it as the rolling pre-release `android-latest` (one stable download link, replaced on every push).
on:
  workflow_dispatch:
  push:
    branches: [main, android-build]
    paths: ["native/**", ".github/workflows/android.yml", "assets/ui/**", "assets/audio/**"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CARGO_NDK_VERSION: 3.5.4
  CARGO_TERM_COLOR: always
  # Smaller .so (AGP would strip anyway, but this also shortens the link and the artifact cache).
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch the decomp submodules
        run: git submodule update --init --depth 1 reference/sm64 reference/mk64 reference/oot reference/banjo-kazooie

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The NDK is ~1 GB: restore it instead of downloading it on every run (setup-android skips installed packages).
      - name: Cache the Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Point cargo-ndk at the pinned NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: true
          key: android-ndk${{ env.NDK_VERSION }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      # The crate is [rlib, staticlib] for the desktop and iOS builds; the Android app needs the cdylib that
      # GameActivity loads (it exports `android_main` from #[bevy_main]).
      - name: Build libjumpman_game.so (arm64-v8a)
        working-directory: native
        run: >
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs
          rustc --release --lib --crate-type cdylib --locked

      - name: Check the shared library
        working-directory: native
        run: |
          so=android/app/src/main/jniLibs/arm64-v8a/libjumpman_game.so
          ls -l "$so"
          readelf=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          "$readelf" -d "$so" | grep NEEDED
          "$readelf" --dyn-syms "$so" | grep -E "android_main|Java_com_anf_jumpman_android_Native_padEvent|GameActivity_onCreate"
          # Everything NEEDED must be a platform library (or one we ship).
          if "$readelf" -d "$so" | grep NEEDED | grep -q "libc++_shared"; then
            cp "$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so)" android/app/src/main/jniLibs/arm64-v8a/
          fi

      # ROM-free inputs of the on-device SM64 import: decomp sources listed in byor/decomp-manifest.txt, the music engine template
      # and the original assets, as one zip (the only asset the APK may carry; verify-apk.py audits every member).
      - name: Build byor-src.zip
        run: python3 native/android/make-byor-src.py native/android/app/src/byorAssets/byor-src.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # The release key lives in GitHub secrets (forks and pull requests have none and fall back to the debug key).
      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jumpman-release.jks"
            echo "JUMPMAN_KEYSTORE=$RUNNER_TEMP/jumpman-release.jks" >> "$GITHUB_ENV"
            echo "JUMPMAN_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Assemble the APK
        working-directory: native/android
        env:
          JUMPMAN_VERSION_CODE: ${{ github.run_number }}
          JUMPMAN_VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          mkdir -p dist
          cp native/android/app/build/outputs/apk/release/app-release.apk "dist/jumpman-android-${GITHUB_SHA}.apk"
          ls -l dist
          echo "path=dist/jumpman-android-${GITHUB_SHA}.apk" >> "$GITHUB_OUTPUT"

      - name: Verify the APK carries no ROM data and is a real arm64 app
        run: |
          python3 native/android/verify-apk.py "${{ steps.apk.outputs.path }}"
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "${{ steps.apk.outputs.path }}" | head -20 || true
          unzip -l "${{ steps.apk.outputs.path }}" | tail -30
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "${{ steps.apk.outputs.path }}" | head -10 || true

      - uses: actions/upload-artifact@v4
        with:
          name: jumpman-android-${{ github.sha }}.apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # Rolling release: https://github.com/<repo>/releases/tag/android-latest (a pre-release, replaced on every push to main).
  release:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jumpman-android-${{ github.sha }}.apk
          path: dist
      - name: Publish android-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=$(ls dist/*.apk)
          cp "$apk" dist/jumpman-android.apk
          notes="Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA}. Contains no game data: copy the data folder from a Mac import, or import ROMs on the device (see native/ANDROID.md). Signed with the project release key, so a new build installs over the previous one (if you installed an earlier throwaway-signed build, uninstall it once)."
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest dist/jumpman-android.apk --target "$GITHUB_SHA" --prerelease --title "Android build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" --notes "$notes"
