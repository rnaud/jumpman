name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate deploy assets
        run: node scripts/check-deploy-assets.mjs
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Play Battlefield from spawn to the Chain Chomp star
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/jumpman-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:4173/ >/dev/null
          CHROME="$(command -v google-chrome)" URL=http://127.0.0.1:4173 node scripts/battlefield-gate-smoke.mjs
          CHROME="$(command -v google-chrome)" URL=http://127.0.0.1:4173 node scripts/oot-link-smoke.mjs --menu-only
          CHROME="$(command -v google-chrome)" URL=http://127.0.0.1:4173 node scripts/oot-courses-smoke.mjs
          CHROME="$(command -v google-chrome)" URL=http://127.0.0.1:4173 node scripts/kokiri-village-smoke.mjs
          CHROME="$(command -v google-chrome)" URL=http://127.0.0.1:4173 node scripts/kokiri-shop-smoke.mjs
          CHROME="$(command -v google-chrome)" URL=http://127.0.0.1:4173 node scripts/kokiri-residents-smoke.mjs
          CHROME="$(command -v google-chrome)" URL=http://127.0.0.1:4173 node scripts/kokiri-sword-smoke.mjs
      - name: Deploy verified commit to Jumpman
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
          pnpm exec wrangler deploy --message "GitHub commit $GITHUB_SHA"
