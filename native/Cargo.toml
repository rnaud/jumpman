[package]
name = "jumpman"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bevy = { version = "0.16.1", default-features = false, features = ["bevy_winit", "bevy_gltf", "bevy_core_pipeline", "bevy_pbr", "animation", "bevy_log", "bevy_ui", "bevy_text", "default_font", "bevy_gilrs", "bevy_window", "bevy_audio", "std", "png", "tonemapping_luts", "ktx2", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jumpman-sim = { path = "sim" }
wasmi = "2"

[workspace]
members = ["sim"]

# The SM64 sequence player + RSP mixer runs as WebAssembly inside wasmi; keep the interpreter fast in debug builds.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
