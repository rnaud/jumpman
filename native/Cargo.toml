[package]
name = "jumpman"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["bevy_winit", "bevy_gltf", "bevy_core_pipeline", "bevy_pbr", "bevy_animation", "bevy_anti_alias", "bevy_post_process", "bevy_light", "bevy_ui_render", "bevy_solari", "bevy_render", "bevy_mesh", "bevy_camera", "bevy_image", "bevy_shader", "bevy_material", "bevy_asset", "bevy_color", "bevy_world_serialization", "bevy_sprite_render", "hdr", "bevy_gizmos_render", "smaa_luts", "gltf_animation", "reflect_auto_register", "debug", "bevy_log", "bevy_ui", "bevy_text", "default_font", "bevy_window", "bevy_audio", "std", "png", "jpeg","tonemapping_luts", "ktx2", "zstd_rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jumpman-sim = { path = "sim" }
wasmi = "2"
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }

[lib]
name = "jumpman_game"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "jumpman"
path = "src/bin_main.rs"

[build-dependencies]
cc = "1"

[features]
# Gamepads come from GameController.framework (src/controller, iOS + macOS). `gilrs` is an opt-in
# fallback for generic HID pads on desktop; it would double-register pads GameController also sees.
gilrs = ["bevy/bevy_gilrs"]

[workspace]
members = ["sim"]

# The SM64 sequence player + RSP mixer runs as WebAssembly inside wasmi; keep the interpreter fast in debug builds.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
